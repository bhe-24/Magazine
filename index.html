<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Cendekia Aksara</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        /* --- RESET & DASAR --- */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Poppins', sans-serif;
            /* Latar Belakang Gradasi Navy ke Kuning */
            background: linear-gradient(135deg, #003366 0%, #004080 60%, #FFD700 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Mencegah scroll berlebih */
            padding: 20px;
        }

        /* --- KARTU LOGIN --- */
        .login-card {
            width: 100%;
            max-width: 380px; /* Tidak terlalu besar di desktop */
            background: #fff;
            border-radius: 15px;
            overflow: hidden; /* Agar sudut header mengikuti radius */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Header Kartu (Warna Navy) */
        .card-header {
            background-color: #003366;
            color: #fff;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid #FFD700; /* Aksen Kuning Tipis */
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: #fff; /* Agar logo transparan terlihat jelas */
            border-radius: 50%;
            padding: 5px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* Body Kartu (Warna Putih) */
        .card-body {
            padding: 25px;
            background: #fff;
        }

        /* Form Elements */
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 0.95rem; /* Ukuran pas untuk jari */
            transition: 0.3s;
            background: #f9f9f9;
        }

        .form-control:focus {
            border-color: #003366;
            background: #fff;
        }

        /* Tombol Utama */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #003366;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 51, 102, 0.3);
            transition: transform 0.2s;
        }

        .btn-login:active { transform: scale(0.98); }

        /* Link Bawah */
        .action-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .action-links a {
            text-decoration: none;
            color: #003366;
            font-weight: 600;
        }
        
        .divider { color: #ccc; }

        /* --- POP UP / MODAL MODERN --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 51, 102, 0.6); /* Navy transparan */
            backdrop-filter: blur(3px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transition: 0.3s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-box {
            background: white;
            width: 90%; max-width: 350px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            transform: scale(0.8);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-icon { font-size: 3rem; margin-bottom: 10px; }
        .modal-title { color: #003366; margin-bottom: 10px; font-size: 1.2rem; }
        .modal-text { color: #666; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }

        .btn-modal {
            background: #FFD700; color: #003366;
            padding: 10px 25px; border-radius: 20px;
            border: none; font-weight: bold; cursor: pointer;
            width: 100%;
        }
        
        .btn-close-modal {
            background: #eee; color: #555; margin-top: 10px;
        }

        /* Loading Spinner */
        .spinner {
            width: 40px; height: 40px; border: 4px solid #fff;
            border-top-color: #FFD700; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 15px;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="card-header">
            <img src="https://i.imgur.com/6X9X9X9.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
            <h2>CENDEKIA AKSARA</h2>
            <p style="font-size: 0.8rem; opacity: 0.8; margin-top: 5px;">Gerbang Literasi Digital</p>
        </div>
        
        <div class="card-body">
            <form id="login-form">
                <div class="form-group">
                    <label>Email Pengguna</label>
                    <input type="email" id="email" class="form-control" placeholder="contoh@email.com" required>
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" id="password" class="form-control" placeholder="•••••••" required>
                </div>
                
                <button type="submit" class="btn-login">MASUK SEKARANG</button>
            </form>

            <div class="action-links">
                <a href="#" id="btn-forgot">Lupa Password?</a>
                <span class="divider">|</span>
                <a href="#" id="btn-register">Daftar Akun</a>
            </div>
        </div>
    </div>

    <div id="info-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon">🔔</div>
            <h3 id="modal-title" class="modal-title">Judul</h3>
            <p id="modal-msg" class="modal-text">Pesan akan muncul di sini.</p>
            <button class="btn-modal" onclick="closeModal('info-modal')">Tutup</button>
        </div>
    </div>

    <div id="reset-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">Reset Password</h3>
            <p class="modal-text">Masukkan email yang terdaftar. Kami akan mengirimkan link reset password.</p>
            <input type="email" id="reset-email" class="form-control" placeholder="Email Anda..." style="margin-bottom: 15px;">
            <button class="btn-modal" id="send-reset-btn" style="background: #003366; color: white;">Kirim Link Reset</button>
            <button class="btn-modal btn-close-modal" onclick="closeModal('reset-modal')">Batal</button>
        </div>
    </div>

    <div id="loading-modal" class="modal-overlay">
        <div class="modal-box" style="background: transparent; box-shadow: none;">
            <div class="spinner"></div>
            <p style="color: white; font-weight: bold;">Memproses...</p>
        </div>
    </div>

    <script type="module">
        // Import Config Firebase (Pastikan file firebase-config.js ada di folder yang sama)
        import { auth, showCustomAlert } from './firebase-config.js';
        
        // --- DOM Elements ---
        const loginForm = document.getElementById('login-form');
        const btnForgot = document.getElementById('btn-forgot');
        const btnRegister = document.getElementById('btn-register');
        const sendResetBtn = document.getElementById('send-reset-btn');

        // --- Event Listeners ---

        // 1. Tombol Daftar (Hanya mengarahkan/Info - sesuaikan jika ada file register terpisah)
        btnRegister.onclick = (e) => {
            e.preventDefault();
            // Jika ada file register.html, ganti alert ini dengan: window.location.href = 'register.html';
            showPopup('📝', 'Pendaftaran', 'Silakan hubungi admin atau gunakan menu "Daftar" jika halaman tersedia.'); 
        };

        // 2. Tombol Lupa Password (Buka Modal)
        btnForgot.onclick = (e) => {
            e.preventDefault();
            document.getElementById('reset-modal').classList.add('active');
        };

        // 3. Proses Login
        loginForm.onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            showLoading();

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    hideLoading();
                    // Login Sukses -> Arahkan ke Beranda
                    window.location.href = 'beranda.html'; // Nanti kita buat file ini di langkah selanjutnya
                })
                .catch((error) => {
                    hideLoading();
                    let msg = "Periksa kembali email dan password Anda.";
                    if(error.code === 'auth/user-not-found') msg = "Akun tidak ditemukan.";
                    if(error.code === 'auth/wrong-password') msg = "Password salah.";
                    showPopup('❌', 'Gagal Masuk', msg);
                });
        };

        // 4. Proses Kirim Reset Password
        sendResetBtn.onclick = () => {
            const email = document.getElementById('reset-email').value;
            if(!email) {
                alert("Harap isi email terlebih dahulu.");
                return;
            }

            closeModal('reset-modal');
            showLoading();

            auth.sendPasswordResetEmail(email)
                .then(() => {
                    hideLoading();
                    showPopup('📧', 'Link Terkirim!', 'Silakan cek Inbox email Anda. <b>PENTING:</b> Jangan lupa cek folder SPAM atau Junk jika tidak ada di Inbox utama.');
                })
                .catch((error) => {
                    hideLoading();
                    showPopup('⚠️', 'Gagal', error.message);
                });
        };

        // --- Helper Functions ---

        // Fungsi Tampilkan Pop-up Info
        function showPopup(icon, title, msg) {
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerHTML = msg; // innerHTML agar bisa bold
            document.getElementById('info-modal').classList.add('active');
        }

        // Fungsi Loading
        function showLoading() {
            document.getElementById('loading-modal').classList.add('active');
        }
        function hideLoading() {
            document.getElementById('loading-modal').classList.remove('active');
        }

        // Fungsi Global untuk tutup modal (dipanggil via onclick attribute)
        window.closeModal = function(id) {
            document.getElementById(id).classList.remove('active');
        }

    </script>
</body>
</html>
